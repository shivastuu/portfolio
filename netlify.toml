[build]
  command = "npm run build"
  publish = "out"

# Static export writes the share image without an extension; tell crawlers it's a PNG.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/work/*/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

# Next.js fingerprints everything under /_next/static, so browsers can keep it for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
